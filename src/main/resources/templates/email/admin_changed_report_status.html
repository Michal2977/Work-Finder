<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Admin Respond Notification</title>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body p-4 text-center">
            <h4 class="mb-3">Report Status Updated</h4>

            <p class="mt-4">
                An administrator has updated the status of your report.
            </p>

            <p>
                Log in to your WorkFinder account to view the current status and details of your report.
            </p>

            <a href="http://localhost:5173/login" class="btn btn-primary mt-3">
                View Report
            </a>

            <hr class="my-4">

            <p class="text-muted mb-0">
                This is an automated notification from WorkFinder. Please do not reply to this email.
            </p>
        </div>
    </div>
</div>

</body>
</html>
